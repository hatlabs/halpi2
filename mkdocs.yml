site_name: HALPI2 User Guide
site_url: https://docs.hatlabs.fi/halpi2
site_description: User guide for HALPI2, a Raspberry Pi CM5 carrier board for marine and industrial applications
site_author: Hat Labs

repo_url: https://github.com/hatlabs/halpi2
repo_name: hatlabs/halpi2
edit_uri: edit/main/docs/

# Affinity sources live next to their exports in the repo, but must not ship.
# `overrides/` holds theme templates, which the theme loader reads directly;
# without this they would also be copied to the site as literal Jinja source.
exclude_docs: |
  *.afdesign
  *.afphoto
  overrides/

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/hat_labs_logo.svg
  favicon: assets/hat_labs_logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fi
          name: Suomi
