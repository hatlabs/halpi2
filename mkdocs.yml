site_name: HALPI2 User Guide
site_url: https://docs.hatlabs.fi/halpi2
site_description: User guide for HALPI2, a Raspberry Pi CM5 carrier board for marine and industrial applications
site_author: Hat Labs

repo_url: https://github.com/hatlabs/halpi2
repo_name: hatlabs/halpi2
edit_uri: edit/main/docs/

# Affinity sources live next to their exports in the repo, but must not ship.
exclude_docs: |
  *.afdesign
  *.afphoto

theme:
  name: material
  custom_dir: docs/overrides
  logo: assets/hat_labs_logo.svg
  favicon: assets/hat_labs_logo.svg
  palette:
    scheme: default
    primary: custom
    accent: custom
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - i18n:
      docs_structure: folder
      languages:
        - locale: en
          name: English
          default: true
          build: true
        - locale: fi
          name: Suomi
          build: true
          site_name: HALPI2-käyttöopas
          site_description: HALPI2:n käyttöopas — Raspberry Pi CM5 -emolevy vene- ja teollisuuskäyttöön
          admonition_translations:
            note: Huomio
            warning: Varoitus
            tip: Vinkki
            info: Tietoa
            danger: Vaara
            example: Esimerkki
          nav_translations:
            Introduction: Johdanto
            Getting Started: Aloitusopas
            User Guide: Käyttöopas
            System Operation: Järjestelmän käyttö
            Hardware Guide: Laitteisto-opas
            Interfaces and Connectivity: Liitännät ja tiedonsiirto
            Software Guide: Ohjelmisto-opas
            Troubleshooting: Vianetsintä
            Technical Reference: Tekniset tiedot
            Hardware Reference: Laitteiston tekniset tiedot
            Power Supply Deep Dive: Virransyöttö tarkemmin
            Carrier Board Controller: Emolevyn ohjain
            Software Development: Ohjelmistokehitys
            HALPI2 Daemon: HALPI2-daemon
            System Integration: Järjestelmäintegraatio
            Advanced Configuration: Lisäasetukset
            Other Debian Distributions: Muut Debian-jakelut
            Appendices: Liitteet
            Design Files and Schematics: Suunnittelutiedostot ja kytkentäkaaviot
            Compliance and Certifications: Vaatimustenmukaisuus ja sertifioinnit
            Errata: Tunnetut virheet
            Resources: Lisätietoja
            FAQ: UKK
        - locale: fr
          name: Français
          build: true
          site_name: Guide de l'utilisateur HALPI2
          site_description: Guide de l'utilisateur du HALPI2, carte porteuse Raspberry Pi CM5 pour applications marines et industrielles
          admonition_translations:
            note: Note
            warning: Avertissement
            tip: Astuce
            info: Information
            danger: Danger
            example: Exemple
          nav_translations:
            Introduction: Introduction
            Getting Started: Prise en main
            User Guide: Guide de l'utilisateur
            System Operation: Fonctionnement du système
            Hardware Guide: Guide du matériel
            Interfaces and Connectivity: Interfaces et connectivité
            Software Guide: Guide logiciel
            Troubleshooting: Dépannage
            Technical Reference: Référence technique
            Hardware Reference: Référence matérielle
            Power Supply Deep Dive: L'alimentation en détail
            Carrier Board Controller: Contrôleur de la carte porteuse
            Software Development: Développement logiciel
            HALPI2 Daemon: Démon HALPI2
            System Integration: Intégration système
            Advanced Configuration: Configuration avancée
            Other Debian Distributions: Autres distributions Debian
            Appendices: Annexes
            Design Files and Schematics: Fichiers de conception et schémas
            Compliance and Certifications: Conformité et certifications
            Errata: Problèmes connus
            Resources: Ressources
            FAQ: FAQ
        - locale: de
          name: Deutsch
          build: true
          site_name: HALPI2-Benutzerhandbuch
          site_description: Benutzerhandbuch für den HALPI2, eine Raspberry-Pi-CM5-Trägerplatine für Schiffs- und Industrieanwendungen
          admonition_translations:
            note: Hinweis
            warning: Warnung
            tip: Tipp
            info: Information
            danger: Gefahr
            example: Beispiel
          nav_translations:
            Introduction: Einführung
            Getting Started: Erste Schritte
            User Guide: Benutzerhandbuch
            System Operation: Systembetrieb
            Hardware Guide: Hardware-Handbuch
            Interfaces and Connectivity: Schnittstellen und Konnektivität
            Software Guide: Software-Handbuch
            Troubleshooting: Fehlersuche
            Technical Reference: Technische Referenz
            Hardware Reference: Hardware-Referenz
            Power Supply Deep Dive: Stromversorgung im Detail
            Carrier Board Controller: Controller der Trägerplatine
            Software Development: Softwareentwicklung
            HALPI2 Daemon: HALPI2-Daemon
            System Integration: Systemintegration
            Advanced Configuration: Erweiterte Konfiguration
            Other Debian Distributions: Andere Debian-Distributionen
            Appendices: Anhänge
            Design Files and Schematics: Konstruktionsdateien und Schaltpläne
            Compliance and Certifications: Konformität und Zertifizierungen
            Errata: Bekannte Fehler
            Resources: Ressourcen
            FAQ: FAQ

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true

extra_css:
  - stylesheets/extra.css

extra:
  analytics:
    provider: google
    property: G-F3KDPEBJEF
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/hatlabs

nav:
  - Introduction: index.md
  - Getting Started:
    - Getting Started: getting-started/getting-started.md
  - User Guide:
    - System Operation: user-guide/operation.md
    - Hardware Guide: user-guide/hardware.md
    - Interfaces and Connectivity: user-guide/interfaces.md
    - Software Guide: user-guide/software.md
    - Troubleshooting: user-guide/troubleshooting.md
  - Technical Reference:
    - Hardware Reference: technical-reference/hardware.md
    - Power Supply Deep Dive: technical-reference/power-supply.md
    - Interfaces and Connectivity: technical-reference/interfaces.md
    - Carrier Board Controller: technical-reference/controller.md
  - Software Development:
    - HALPI2 Daemon: software-development/daemon.md
    - System Integration: software-development/integration.md
    - Advanced Configuration: software-development/advanced-config.md
    - Other Debian Distributions: software-development/ubuntu-installation.md
  - Appendices:
    - Design Files and Schematics: appendices/design-files.md
    - Compliance and Certifications: appendices/compliance.md
    - Errata: appendices/errata.md
    - Resources: appendices/resources.md
  - FAQ: faq.md
